<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta -->
    <meta
      name="description"
      content="TruckLagbe is a reliable truck and vehicle rental service for moving goods, logistics, and transportation needs."

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="TruckLagbe — Truck & Vehicle Rental Service"

      property="og:description"
